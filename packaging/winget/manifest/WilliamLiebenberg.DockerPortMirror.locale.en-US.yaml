PackageName: DockerPortMirror
PackageUrl: https://github.com/william-liebenberg/DockerPortMirror
License: MIT
LicenseUrl: https://github.com/william-liebenberg/DockerPortMirror/blob/main/LICENSE
ShortDescription: Mirrors the TCP ports published on a remote Docker host to localhost through SSH.
Description: |-
  DockerPortMirror watches the containers of a remote Docker host, reached through an SSH Docker context,
  and opens one OpenSSH local forward per published TCP port, so every published port is reachable on
  this machine's localhost. Tunnels are added and removed as containers start and stop.
Moniker: dockerportmirror
Tags:
  - docker
  - ssh
  - port-forwarding
  - tunnel
  - cli
